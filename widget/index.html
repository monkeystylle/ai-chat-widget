<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>AI Chat Widget Test</title>
    <style>
      body {
        margin: 0;
        min-height: 200vh;
        font-family: system-ui, sans-serif;
        background: #f1f5f9;
        color: #0f172a;
      }
      body.dark {
        background: #0f172a;
        color: #f1f5f9;
      }
      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 64px 20px;
        line-height: 1.6;
      }
      button.toggle {
        padding: 10px 16px;
        border: 0;
        border-radius: 999px;
        background: #0f172a;
        color: #fff;
        font: inherit;
        cursor: pointer;
      }
      body.dark button.toggle {
        background: #f1f5f9;
        color: #0f172a;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Widget test page</h1>
      <p>
        A stand-in for any website. The chat button appears in the bottom-right
        corner.
      </p>
      <button
        class="toggle"
        type="button"
        onclick="document.body.classList.toggle('dark')"
      >
        Toggle light / dark page
      </button>
    </main>

    <script src="public/widget.js" defer></script>
  </body>
</html>
